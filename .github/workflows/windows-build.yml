name: Windows build

on:
  push:
    branches:
      - windows-port
  pull_request:
    branches:
      - windows-port
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S overlay/kde-media-flyout-overlay -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel
