name: Windows build

on:
  push:
    branches:
      - windows-port
  pull_request:
    branches:
      - windows-port
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S overlay/kde-media-flyout-overlay -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        run: '& "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "build\Release\MediaTable.exe"'

      - name: Create preview launcher
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          start "" "%~dp0MediaTable.exe" --test
          endlocal
          '@ | Set-Content -Path "build\Release\Run-MediaTable-Preview.bat" -Encoding Ascii

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: MediaTable-Windows-preview
          path: build/Release/
          if-no-files-found: error
          retention-days: 14
