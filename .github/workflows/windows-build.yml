name: Windows build

on:
  push:
    branches:
      - windows-port
  pull_request:
    branches:
      - windows-port
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S overlay/kde-media-flyout-overlay -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        run: '& "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "build\Release\MediaTable.exe"'

      - name: Create diagnostic preview launcher
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Starting MediaTable Windows preview...
          echo The preview should appear near the top-left of your main display.
          echo.
          "%~dp0MediaTable.exe" --test > "%~dp0MediaTable-startup.log" 2>&1
          set "APP_EXIT=%ERRORLEVEL%"
          echo.
          echo MediaTable exited with code %APP_EXIT%.
          echo Startup log:
          if exist "%~dp0MediaTable-startup.log" type "%~dp0MediaTable-startup.log"
          echo.
          pause
          exit /b %APP_EXIT%
          '@ | Set-Content -Path "build\Release\Run-MediaTable-Preview.bat" -Encoding Ascii

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Starting MediaTable...
          echo MediaTable will appear when Windows reports an active media session.
          echo Keep this window open to view startup diagnostics.
          echo.
          "%~dp0MediaTable.exe" > "%~dp0MediaTable-startup.log" 2>&1
          set "APP_EXIT=%ERRORLEVEL%"
          echo.
          echo MediaTable exited with code %APP_EXIT%.
          echo Startup log:
          if exist "%~dp0MediaTable-startup.log" type "%~dp0MediaTable-startup.log"
          echo.
          pause
          exit /b %APP_EXIT%
          '@ | Set-Content -Path "build\Release\Run-MediaTable.bat" -Encoding Ascii

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: MediaTable-Windows-preview
          path: build/Release/
          if-no-files-found: error
          retention-days: 14
